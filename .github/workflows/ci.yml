name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimchecker
          POSTGRES_PASSWORD: claimchecker
          POSTGRES_DB: claimchecker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimchecker -d claimchecker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://claimchecker:claimchecker@127.0.0.1:5432/claimchecker_test?schema=public
      TEST_DATABASE_URL: postgresql://claimchecker:claimchecker@127.0.0.1:5432/claimchecker_test?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @claim-checker/api db:generate

      - name: Migrate test database
        run: pnpm --filter @claim-checker/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
